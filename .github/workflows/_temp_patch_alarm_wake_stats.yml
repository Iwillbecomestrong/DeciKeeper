name: One-shot alarm wake statistics patch

on:
  push:
    branches: [ai/fix-alarm-wake-statistics]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/fix-alarm-wake-statistics
          fetch-depth: 0
      - name: Wire alarm session statistics and fix aggregation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          scheduler_path = Path('app/src/main/java/com/zhizhi/app/manager/AlarmScheduler.kt')
          scheduler = scheduler_path.read_text(encoding='utf-8')
          scheduler = replace_once(
              scheduler,
              'import com.zhizhi.app.data.SystemEventClock\nimport com.zhizhi.app.receiver.AlarmReceiver',
              'import com.zhizhi.app.data.SystemEventClock\nimport com.zhizhi.app.manager.statistics.AlarmWakeStatsRecorder\nimport com.zhizhi.app.receiver.AlarmReceiver',
              'AlarmScheduler import'
          )
          scheduler = replace_once(
              scheduler,
              '        val currentToken = alarm?.scheduleToken ?: ""\n\n        try {',
              '        val currentToken = alarm?.scheduleToken ?: ""\n\n        // Start wake statistics only when a real alarm becomes newly active. Recovery\n        // calls for the same active alarm must preserve the original session start.\n        if (!wasSameActiveAlarm && alarmId > 0 && alarm != null) {\n            AlarmWakeStatsRecorder.startSession(\n                context = context,\n                alarmId = alarmId,\n                plannedMinuteOfDay = alarm.hour * 60 + alarm.minute\n            )\n        }\n\n        try {',
              'AlarmScheduler session start'
          )
          scheduler = replace_once(
              scheduler,
              '        if (passed) {\n            val now = System.currentTimeMillis()\n            try {',
              '        if (passed) {\n            val now = System.currentTimeMillis()\n            AlarmWakeStatsRecorder.markFirstStagePassed(context, getActiveAlarmId(context), now)\n            try {',
              'AlarmScheduler first-stage marker'
          )
          scheduler_path.write_text(scheduler, encoding='utf-8')

          overlay_path = Path('app/src/main/java/com/zhizhi/app/ui/LockAlarmOverlay.kt')
          overlay = overlay_path.read_text(encoding='utf-8')
          overlay = replace_once(
              overlay,
              'import com.zhizhi.app.manager.AlarmScheduler\n',
              'import com.zhizhi.app.manager.AlarmScheduler\nimport com.zhizhi.app.manager.statistics.AlarmWakeStatsRecorder\n',
              'LockAlarmOverlay import'
          )
          overlay = replace_once(
              overlay,
              '        // All done (single-stage, or two-stage all challenges complete)\n        view.clearFocus()',
              '        // All done (single-stage, or two-stage all challenges complete).\n        // Commit before the review/close screen so review time is not counted as wake time.\n        if (alarmId > 0) {\n            AlarmWakeStatsRecorder.completeSession(ctx, alarmId)\n        }\n        view.clearFocus()',
              'LockAlarmOverlay completion marker'
          )
          overlay_path.write_text(overlay, encoding='utf-8')

          repo_path = Path('app/src/main/java/com/zhizhi/app/manager/statistics/StatisticsRepository.kt')
          repo = repo_path.read_text(encoding='utf-8')
          start = repo.index('    fun getAlarmStats(')
          next_fun = repo.index('    fun getRuleProtectionStats(', start)
          section4 = repo.rfind('    // ==========================================', start, next_fun)
          if section4 < start:
              raise RuntimeError('StatisticsRepository: section 4 marker not found')

          replacement = r'''    fun getAlarmStats(
              context: Context,
              range: StatsDateRange,
              resolvedRange: ResolvedDateRange,
              weekdayFilter: WeekdayFilter
          ): AlarmStatsSummary {
              val buckets = StatsDateRangeResolver.buildBuckets(range, resolvedRange, weekdayFilter, zoneId)
              val today = LocalDate.now(zoneId)
              val prefs = try {
                  context.getSharedPreferences("alarm_stats_ledger", Context.MODE_PRIVATE)
              } catch (_: Exception) {
                  null
              }
              val dateFormatter = DateTimeFormatter.ofPattern("yyyyMMdd")
              val datedRecords = mutableListOf<Pair<LocalDate, AlarmWakeRecord>>()

              if (prefs != null) {
                  val startDate = LocalDateTime.ofInstant(
                      Instant.ofEpochMilli(resolvedRange.startMillis), zoneId
                  ).toLocalDate()
                  val endDateExclusive = LocalDateTime.ofInstant(
                      Instant.ofEpochMilli(resolvedRange.endMillisExclusive), zoneId
                  ).toLocalDate()

                  var date = startDate
                  while (date.isBefore(endDateExclusive)) {
                      if (!date.isAfter(today) && weekdayFilter.isEnabled(date.dayOfWeek)) {
                          val dateKey = date.format(dateFormatter)
                          val wakeKey = "alarm_${dateKey}_wake_time"
                          if (prefs.contains(wakeKey)) {
                              val wakeMinute = prefs.getInt(wakeKey, 420).coerceIn(0, 1439)
                              val alarmTimeMillis = date
                                  .atTime(wakeMinute / 60, wakeMinute % 60)
                                  .atZone(zoneId)
                                  .toInstant()
                                  .toEpochMilli()

                              if (alarmTimeMillis >= resolvedRange.startMillis &&
                                  alarmTimeMillis < resolvedRange.endMillisExclusive
                              ) {
                                  val stage1 = prefs.getInt("alarm_${dateKey}_stage1_duration", 5)
                                      .coerceAtLeast(0)
                                  val total = prefs.getInt("alarm_${dateKey}_total_duration", 8)
                                      .coerceAtLeast(stage1)
                                  val firstStageCompletedMinute = if (
                                      prefs.contains("alarm_${dateKey}_stage1_completed_minute")
                                  ) {
                                      prefs.getInt(
                                          "alarm_${dateKey}_stage1_completed_minute",
                                          (wakeMinute + stage1) % 1440
                                      ).coerceIn(0, 1439)
                                  } else {
                                      (wakeMinute + stage1) % 1440
                                  }

                                  datedRecords += date to AlarmWakeRecord(
                                      id = "alarm-$dateKey",
                                      dateLabel = date.format(shortDateFormatter),
                                      alarmMinuteOfDay = wakeMinute,
                                      firstStageCompletedMinute = firstStageCompletedMinute,
                                      firstStageDurationMinutes = stage1,
                                      totalFlowDurationMinutes = total
                                  )
                              }
                          }
                      }
                      date = date.plusDays(1)
                  }
              }

              fun medianInt(values: List<Int>): Int? {
                  if (values.isEmpty()) return null
                  val sorted = values.sorted()
                  return sorted[sorted.size / 2]
              }

              val bucketDataList = buckets.map { bucket ->
                  val recordsInBucket = datedRecords.asSequence()
                      .filter { (date, record) ->
                          val minute = record.alarmMinuteOfDay.coerceIn(0, 1439)
                          val eventMillis = date
                              .atTime(minute / 60, minute % 60)
                              .atZone(zoneId)
                              .toInstant()
                              .toEpochMilli()
                          eventMillis >= bucket.startMillis && eventMillis < bucket.endMillisExclusive
                      }
                      .map { it.second }
                      .toList()

                  if (recordsInBucket.isEmpty()) {
                      AlarmBucketData(bucket, null, null, null, null)
                  } else {
                      AlarmBucketData(
                          bucket = bucket,
                          alarmMinuteOfDay = medianInt(recordsInBucket.map { it.alarmMinuteOfDay })?.toFloat(),
                          firstStageCompletedMinute = medianInt(
                              recordsInBucket.map { it.firstStageCompletedMinute }
                          )?.toFloat(),
                          firstStageDurationMinutes = medianInt(
                              recordsInBucket.map { it.firstStageDurationMinutes }
                          )?.toFloat(),
                          totalFlowDurationMinutes = medianInt(
                              recordsInBucket.map { it.totalFlowDurationMinutes }
                          )?.toFloat()
                      )
                  }
              }

              val validRecords = datedRecords.map { it.second }
              val recent = datedRecords
                  .sortedByDescending { it.first }
                  .take(5)
                  .map { it.second }

              return AlarmStatsSummary(
                  medianAlarmMinuteOfDay = medianInt(validRecords.map { it.alarmMinuteOfDay }),
                  medianFirstStageDurationMinutes = medianInt(
                      validRecords.map { it.firstStageDurationMinutes }
                  ),
                  medianTotalFlowDurationMinutes = medianInt(
                      validRecords.map { it.totalFlowDurationMinutes }
                  ),
                  recordedDaysCount = validRecords.size,
                  buckets = bucketDataList,
                  recentRecords = recent
              )
          }

'''
          repo = repo[:start] + replacement + repo[section4:]
          repo_path.write_text(repo, encoding='utf-8')
          PY

          git rm .github/workflows/_temp_patch_alarm_wake_stats.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zhizhi/app/manager/AlarmScheduler.kt \
                  app/src/main/java/com/zhizhi/app/manager/statistics/StatisticsRepository.kt \
                  app/src/main/java/com/zhizhi/app/ui/LockAlarmOverlay.kt
          git commit -m "fix: connect real alarm completion to wake statistics"
          git push origin HEAD:ai/fix-alarm-wake-statistics
