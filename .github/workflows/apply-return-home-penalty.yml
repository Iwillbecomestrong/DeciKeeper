name: Apply Return Home Penalty Patch

on:
  push:
    branches:
      - ai/fix-return-home-penalty
    paths:
      - tools/apply-return-home-penalty-patch.ps1
      - .github/workflows/apply-return-home-penalty.yml

permissions:
  contents: write

jobs:
  apply-test-build-commit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ai/fix-return-home-penalty

      - name: Detect Android SDK from adb
        shell: powershell
        run: |
          $adbCommand = Get-Command adb -ErrorAction Stop
          $adb = $adbCommand.Definition
          if (-not $adb -or -not (Test-Path $adb)) {
            throw "adb executable path could not be resolved from PowerShell alias definition"
          }
          $sdkRoot = Split-Path (Split-Path $adb -Parent) -Parent
          if (-not (Test-Path (Join-Path $sdkRoot "platforms\android-36"))) {
            throw "Android SDK 36 not found under detected SDK root: $sdkRoot"
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply source migration
        shell: powershell
        run: .\tools\apply-return-home-penalty-patch.ps1

      - name: Check patch whitespace
        shell: powershell
        run: git diff --check

      - name: Run all unit tests
        shell: powershell
        run: .\gradlew.bat --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: powershell
        run: .\gradlew.bat --no-daemon assembleDebug

      - name: Commit verified source change
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zhizhi/app/ui/LockWindowManager.kt
          if (git diff --cached --quiet) {
            throw "Patch produced no source change"
          }
          git commit -m "fix: count penalty from return-home button"
          git push origin HEAD:ai/fix-return-home-penalty
