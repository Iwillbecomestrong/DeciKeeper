name: One-shot remove settings policy dead code

on:
  push:
    branches:
      - ai/time-rules-spec-sync
    paths:
      - .github/workflows/one-shot-remove-settings-policy-dead-code.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ai/time-rules-spec-sync
          fetch-depth: 0

      - name: Remove migrated policy controller from Settings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'app/src/main/java/com/zhizhi/app/ui/RulesFragment.kt'
          $text = [System.IO.File]::ReadAllText($path)

          function Replace-Required([string]$old, [string]$new, [string]$label) {
            if (-not $script:text.Contains($old)) {
              throw "Expected pattern not found: $label"
            }
            $script:text = $script:text.Replace($old, $new)
          }

          Replace-Required "import com.zhizhi.app.manager.EffectiveActivationPolicyManager`r`n" "" "policy manager import"
          Replace-Required "    private var rgEffectivePolicy: android.widget.RadioGroup? = null`r`n    private var tvEffectivePolicyStatus: TextView? = null`r`n    private var policyUiUpdating = false`r`n" "" "settings policy fields"
          Replace-Required "        updateEffectivePolicyUI()`r`n" "" "onResume policy refresh"
          Replace-Required "        rgEffectivePolicy = view.findViewById(R.id.rg_effective_policy)`r`n        // tvEffectivePolicyStatus = view.findViewById(R.id.tv_effective_policy_status)`r`n" "" "settings policy view binding"
          Replace-Required "`r`n        setupEffectivePolicyToggle()`r`n" "`r`n" "settings policy setup call"
          Replace-Required "        view.findViewById<TextView>(R.id.btn_effective_policy_help)?.setOnClickListener {`r`n            showEffectivePolicyHelpDialog()`r`n        }`r`n`r`n" "" "settings policy help click"

          # importSettingsFromUri also refreshed the removed Settings policy controls.
          # Remove the one remaining UI-only refresh call if present after earlier replacement.
          $text = $text.Replace("                updateEffectivePolicyUI()`r`n", "")

          $setupPattern = '(?s)\r?\n    private fun setupEffectivePolicyToggle\(\) \{.*?\r?\n    private fun setupAntiUninstallSwitch'
          if (-not [regex]::IsMatch($text, $setupPattern)) {
            throw 'Expected setup/update policy function block not found'
          }
          $text = [regex]::Replace($text, $setupPattern, "`r`n    private fun setupAntiUninstallSwitch", 1)

          $helpPattern = '(?s)\r?\n    private fun showEffectivePolicyHelpDialog\(\) \{.*?\r?\n    private fun isAccessibilityServiceEnabled'
          if (-not [regex]::IsMatch($text, $helpPattern)) {
            throw 'Expected policy help function block not found'
          }
          $text = [regex]::Replace($text, $helpPattern, "`r`n    private fun isAccessibilityServiceEnabled", 1)

          foreach ($forbidden in @(
            'EffectiveActivationPolicyManager',
            'setupEffectivePolicyToggle',
            'updateEffectivePolicyUI',
            'showEffectivePolicyHelpDialog',
            'rgEffectivePolicy',
            'policyUiUpdating'
          )) {
            if ($text.Contains($forbidden)) {
              throw "Settings policy dead code still present: $forbidden"
            }
          }

          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))

          Remove-Item '.github/workflows/one-shot-remove-settings-policy-dead-code.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path .github/workflows/one-shot-remove-settings-policy-dead-code.yml
          git diff --cached --check
          git commit -m 'refactor(settings): remove migrated time policy controller'
          git push origin HEAD:ai/time-rules-spec-sync
