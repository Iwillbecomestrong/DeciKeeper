name: One-shot move policy card

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  remove-settings-policy-card:
    if: github.head_ref == 'ai/time-rules-spec-sync'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove duplicate policy card from settings
        shell: powershell
        run: |
          $script = @'
          from pathlib import Path

          root = Path.cwd()
          layout_path = root / 'app/src/main/res/layout/fragment_rules.xml'
          workflow_path = root / '.github/workflows/one-shot-move-policy-card.yml'
          text = layout_path.read_text(encoding='utf-8')

          marker = 'android:text="\u751f\u6548\u7b56\u7565"'
          marker_index = text.find(marker)
          if marker_index < 0:
              raise RuntimeError('Settings policy card marker not found')

          card_start_token = '\n        <androidx.cardview.widget.CardView'
          card_end_token = '\n        </androidx.cardview.widget.CardView>'
          start = text.rfind(card_start_token, 0, marker_index)
          end = text.find(card_end_token, marker_index)
          if start < 0 or end < 0:
              raise RuntimeError('Could not locate enclosing settings policy CardView')
          end += len(card_end_token)
          if end < len(text) and text[end] == '\n':
              end += 1

          text = text[:start] + '\n' + text[end:]

          for forbidden in ('@+id/rg_effective_policy', '@+id/btn_effective_policy_help'):
              if forbidden in text:
                  raise RuntimeError(f'Duplicate settings policy control remains: {forbidden}')

          layout_path.write_text(text, encoding='utf-8', newline='\n')
          workflow_path.unlink()
          '@

          $scriptPath = Join-Path $env:RUNNER_TEMP 'remove_settings_policy_card.py'
          [System.IO.File]::WriteAllText($scriptPath, $script, (New-Object System.Text.UTF8Encoding($false)))
          python $scriptPath

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/layout/fragment_rules.xml .github/workflows/one-shot-move-policy-card.yml
          git diff --cached --check
          git commit -m 'refactor(ui): remove policy card from settings'
          git push origin HEAD:${{ github.head_ref }}
