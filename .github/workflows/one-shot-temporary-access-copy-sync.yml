name: One-shot temporary access copy sync

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply-copy-fix:
    if: github.head_ref == 'ai/time-rules-spec-sync'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace legacy temporary-access terminology
        shell: powershell
        run: |
          function Decode-Utf8([string]$b64) {
            return [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64))
          }

          $paths = @(
            'app/src/main/java/com/zhizhi/app/ui/HelpActivity.kt',
            'app/src/main/java/com/zhizhi/app/ui/LockWindowManager.kt',
            'app/src/main/res/layout/window_lock_screen.xml',
            'app/src/main/res/layout/activity_global_params_new.xml',
            (Decode-Utf8 'ZG9jcy/kvb/nlKjmiYvlhowubWQ=')
          )

          $oldLong = Decode-Utf8 '6LaF57qn5Li05pe25pS+6KGM'
          $oldShort = Decode-Utf8 '6LaF57qn5Li05pe2'
          $canonical = Decode-Utf8 '5Li05pe26Kej6ZSB'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          foreach ($path in $paths) {
            $content = [System.IO.File]::ReadAllText($path)
            $content = $content.Replace($oldLong, $canonical)
            $content = $content.Replace($oldShort, $canonical)
            [System.IO.File]::WriteAllText($path, $content, $utf8NoBom)
          }

          $lockPath = 'app/src/main/java/com/zhizhi/app/ui/LockWindowManager.kt'
          $lockContent = [System.IO.File]::ReadAllText($lockPath)
          $lockOld = Decode-Utf8 '5Li05pe26Kej6ZSB5L2/55So5Y+X6ZmQ5bqU55SoKDw9'
          $lockNew = Decode-Utf8 '5Li05pe26Kej6ZSBKDw9'
          $lockContent = $lockContent.Replace($lockOld, $lockNew)
          [System.IO.File]::WriteAllText($lockPath, $lockContent, $utf8NoBom)

          $helpPath = 'app/src/main/java/com/zhizhi/app/ui/HelpActivity.kt'
          $helpContent = [System.IO.File]::ReadAllText($helpPath)
          $helpOld = Decode-Utf8 '5Li05pe25L2/55So5Y+X6ZmQ5bqU55So5pe26ZW/5LiK6ZmQIOKAlOKAlCDkuLTml7bop6PplIHml7Y='
          $helpNew = Decode-Utf8 '5Li05pe26Kej6ZSB5pe26ZW/5LiK6ZmQIOKAlOKAlCDkuLTml7bop6PplIHml7Y='
          $helpContent = $helpContent.Replace($helpOld, $helpNew)
          [System.IO.File]::WriteAllText($helpPath, $helpContent, $utf8NoBom)

          Remove-Item '.github/workflows/one-shot-temporary-access-copy-sync.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $paths $lockPath $helpPath .github/workflows/one-shot-temporary-access-copy-sync.yml
          git diff --cached --check
          git commit -m 'fix(copy): unify temporary unlock terminology'
          git push origin HEAD:${{ github.head_ref }}
