name: alarm-reminder-redesign

on:
  push:
    branches:
      - ai/alarm-reminder-redesign

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run alert policy test
        run: ./gradlew :app:testDebugUnitTest --tests com.zhizhi.app.AlarmAlertPolicyTest --stacktrace
      - name: Run full unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zhizhi-alarm-reminder-redesign-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
