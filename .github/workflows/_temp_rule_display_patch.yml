name: Temporary Rule Display Patch

on:
  push:
    branches: [ai/rule-display-baseline-consistency]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rule-display-patch]') }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ai/rule-display-baseline-consistency
          fetch-depth: 0

      - name: Apply patch and commit
        shell: powershell
        run: |
          $encoded = ''
          $bytes = [Convert]::FromBase64String($encoded)
          $script = [Text.Encoding]::UTF8.GetString($bytes)
          Invoke-Expression $script
