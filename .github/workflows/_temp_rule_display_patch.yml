name: Temporary Rule Display Cleanup

on:
  push:
    branches: [ai/rule-display-baseline-consistency]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ai/rule-display-baseline-consistency
          fetch-depth: 0

      - name: Fix encoding pollution and remove temporary workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manager = 'app/src/main/java/com/zhizhi/app/manager/AppWindowManager.kt'
          $content = [System.IO.File]::ReadAllText($manager, [System.Text.Encoding]::UTF8)
          $bad = [string][char]0x515E
          $good = [string][char]0x5176
          if (-not $content.Contains($bad)) {
            throw 'Expected corrupted character was not found in AppWindowManager.kt'
          }
          $fixed = $content.Replace($bad, $good)
          if ($fixed.Contains($bad)) {
            throw 'Corrupted character still remains after replacement'
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manager, $fixed, $utf8NoBom)

          git rm .github/workflows/_temp_rule_display_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $manager
          git commit -m "fix: clean rule display copy and remove temporary workflow"
          git push origin HEAD:ai/rule-display-baseline-consistency
