name: Temporary Rule Display Patch

on:
  push:
    branches: [ai/rule-display-baseline-consistency]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rule-display-patch]') }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ai/rule-display-baseline-consistency
          fetch-depth: 0

      - name: Apply baseline display patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-Utf8([string]$path) {
            return [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          }

          function Write-Utf8([string]$path, [string]$content) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($path, $content, $utf8NoBom)
          }

          function Replace-Required([string]$path, [string]$old, [string]$new) {
            $content = Read-Utf8 $path
            if (-not $content.Contains($old)) {
              throw "Expected text not found in $path : $old"
            }
            Write-Utf8 $path ($content.Replace($old, $new))
          }

          function Regex-Replace-Required([string]$path, [string]$pattern, [string]$replacement) {
            $content = Read-Utf8 $path
            $regex = New-Object System.Text.RegularExpressions.Regex($pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $regex.IsMatch($content)) {
              throw "Expected regex not found in $path : $pattern"
            }
            Write-Utf8 $path ($regex.Replace($content, $replacement, 1))
          }

          $ui = 'app/src/main/java/com/zhizhi/app/ui/AppWindowFragment.kt'
          $manager = 'app/src/main/java/com/zhizhi/app/manager/AppWindowManager.kt'
          $manual = 'docs/使用手册.md'

          Replace-Required $ui 'tvPendingChanges.text = "有待生效的变更，将于明日 $refreshTime 生效"' 'tvPendingChanges.text = "有待生效的变更，将在下一刷新时刻 $refreshTime 生效"'

          $togglePattern = '    private fun onToggleRule\(position: Int, isEnabled: Boolean\) \{.*?\r?\n    \}\r?\n\r?\n    private fun onUndoRule'
          $toggleReplacement = @'
    private fun onToggleRule(position: Int, isEnabled: Boolean) {
        if (isSettingsLocked()) return
        val item = rulesWithStatus[position]
        val rule = item.rule
        if (rule.isEnabled == isEnabled) return

        val newRule = rule.copy(isEnabled = isEnabled)
        val analysis = AppWindowManager.analyzeChangeForDisplay(
            requireContext(),
            item.baselineRule,
            rule,
            newRule
        )

        showDetailedConfirmDialog(analysis, {
            AppWindowManager.updateRule(requireContext(), newRule)
            refreshList()
        }, rule.id)
    }

    private fun onUndoRule
'@
          Regex-Replace-Required $ui $togglePattern $toggleReplacement

          Replace-Required $ui '// 🚀 对比当前活跃规则，只看本次修改（baseline 用于判断有利/不利）
                val analysis = AppWindowManager.analyzeChange(context, rule, newRule)' '// 展示与执行统一基于同一份 baseline 语义，避免弹窗和实际生效时机不一致
                val analysis = AppWindowManager.analyzeChangeForDisplay(context, baseline, rule, newRule)'

          $deletePattern = '    private fun showDeleteConfirmDialog\(rule: AppWindowManager\.AppWindowRule, baseline: AppWindowManager\.AppWindowRule\? = null\) \{.*?\r?\n    \}\r?\n\r?\n    private fun showAppSelectionDialog'
          $deleteReplacement = @'
    private fun showDeleteConfirmDialog(rule: AppWindowManager.AppWindowRule, baseline: AppWindowManager.AppWindowRule? = null) {
        if (isSettingsLocked()) return
        val analysis = AppWindowManager.analyzeChangeForDisplay(
            requireContext(),
            baseline,
            rule,
            null
        )

        showDetailedConfirmDialog(analysis, {
            AppWindowManager.deleteRule(requireContext(), rule.id)
            refreshList()
        }, rule.id)
    }

    private fun showAppSelectionDialog
'@
          Regex-Replace-Required $ui $deletePattern $deleteReplacement

          Replace-Required $ui 'if (analysis.details.any { it.type == AppWindowManager.ChangeType.INFO }) {' 'if (analysis.details.all { it.type == AppWindowManager.ChangeType.INFO }) {'

          $dialogPattern = '    private fun showDetailedConfirmDialog\(analysis: AppWindowManager\.ChangeAnalysis, onConfirm: \(\) -> Unit, targetRuleId: String\? = null\) \{.*?\r?\n    \}\r?\n\}'
          $dialogReplacement = @'
    private fun showDetailedConfirmDialog(analysis: AppWindowManager.ChangeAnalysis, onConfirm: () -> Unit, targetRuleId: String? = null) {
        val context = requireContext()
        val refreshTime = TimeRuleManager.getRefreshTime(context)

        // 适应期内所有修改均立即生效，但仍使用同一份分析结果描述“加严/放宽/恢复基准”。
        val isAdaptation = CreditManager.isInAdaptationPeriod(context)
        if (isAdaptation) {
            val sb = StringBuilder()
            sb.append("当前处于【适应期】，所有修改均立即生效。\n\n")
            analysis.details.filter { it.type != AppWindowManager.ChangeType.INFO }.forEach {
                sb.append("• ${it.text}\n")
            }
            sb.append("\n(适应期结束后，放宽规则的修改将在下一刷新时刻生效)")

            AlertDialog.Builder(context)
                .setTitle("✅ 适应期 · 立即生效")
                .setMessage(sb.toString().trim())
                .setPositiveButton("确定") { _, _ -> onConfirm() }
                .setNegativeButton("取消") { _, _ -> refreshList() }
                .show()
            return
        }

        if (analysis.details.all { it.type == AppWindowManager.ChangeType.INFO }) {
            Toast.makeText(context, "设置已保存 (未发生变更)", Toast.LENGTH_SHORT).show()
            onConfirm()
            return
        }

        val isAllNextDayPolicy =
            EffectiveActivationPolicyManager.getPolicy(context) == EffectiveActivationPolicyManager.Policy.ALL_NEXT_DAY
        val sb = StringBuilder()
        if (isAllNextDayPolicy) {
            sb.append("当前策略：勿扰时段和应用时间窗的修改统一在下一刷新时刻 $refreshTime 生效。\n\n")
        }

        val restored = analysis.details.filter { it.type == AppWindowManager.ChangeType.RESTORED }
        if (restored.isNotEmpty()) {
            val timing = if (isAllNextDayPolicy) "下一刷新时刻生效" else "立即生效"
            sb.append("🟢 【恢复基准 · $timing】\n")
            restored.forEach { sb.append("• ${it.text}\n") }
            sb.append("\n")
        }

        val favorable = analysis.details.filter { it.type == AppWindowManager.ChangeType.FAVORABLE }
        if (favorable.isNotEmpty()) {
            val label = when {
                isAllNextDayPolicy -> "🔵 【加严 · 下一刷新时刻生效】"
                analysis.isOverallAdverse -> "🔵 【加严】"
                else -> "🔵 【加严 · 立即生效】"
            }
            sb.append("$label\n")
            favorable.forEach { sb.append("• ${it.text}\n") }
            sb.append("\n")
        }

        val adverse = analysis.details.filter { it.type == AppWindowManager.ChangeType.ADVERSE }
        if (adverse.isNotEmpty()) {
            sb.append("🟠 【放宽 · 下一刷新时刻生效】\n")
            adverse.forEach { sb.append("• ${it.text}\n") }
            sb.append("\n")
        }

        if (targetRuleId != null) {
            val pendingRules = AppWindowManager.getPendingRules(context)
            val pendingForThisRule = pendingRules?.find { it.id == targetRuleId }
            if (pendingForThisRule != null) {
                sb.append("\n\n📋 注意：该规则已有待生效变更：\n")
                sb.append("  - ${pendingForThisRule.name} (${AppWindowManager.formatTimeRange(pendingForThisRule)})\n")
                sb.append("本次修改将与上述变更合并，在下一刷新时刻 $refreshTime 生效。")
            }
        }

        sb.append("\n确定要应用这些更改吗？")

        AlertDialog.Builder(context)
            .setTitle(
                when {
                    isAllNextDayPolicy -> "⏳ 统一延后"
                    analysis.isOverallAdverse -> "⚠️ 包含放宽项"
                    else -> "变更确认"
                }
            )
            .setMessage(sb.toString().trim())
            .setPositiveButton("确定") { _, _ -> onConfirm() }
            .setNegativeButton("取消") { _, _ -> refreshList() }
            .show()
    }
}
'@
          Regex-Replace-Required $ui $dialogPattern $dialogReplacement

          $displayPattern = '    /\*\*\r?\n     \* 供 UI 保存弹窗使用：与 applyChange 的关键豁免保持一致，避免“弹窗说不利、执行却立即生效”。\r?\n     \*/\r?\n    fun analyzeChangeForDisplay\(.*?\r?\n    \}\r?\n\r?\n    fun analyzeChange\('
          $displayReplacement = @'
    /**
     * UI 展示的单一分析入口。比较基准必须与 applyChange 一致，避免“弹窗说延后、执行却立即”的分裂。
     */
    fun analyzeChangeForDisplay(
        context: Context,
        baselineRule: AppWindowRule?,
        oldRule: AppWindowRule?,
        newRule: AppWindowRule?
    ): ChangeAnalysis {
        if (baselineRule != null && newRule != null &&
            isRuleContentSame(baselineRule, newRule) &&
            (oldRule == null || !isRuleContentSame(oldRule, newRule))
        ) {
            return ChangeAnalysis(
                isOverallAdverse = false,
                details = listOf(ChangeDetail("恢复到本次刷新时的基准设置", ChangeType.RESTORED))
            )
        }

        if (baselineRule == null && oldRule != null && newRule == null) {
            val apps = formatAppNames(context, oldRule.packageNames)
            val suffix = if (apps.isBlank()) "" else "：$apps"
            return ChangeAnalysis(
                isOverallAdverse = false,
                details = listOf(ChangeDetail("恢复到本次刷新时的基准设置$suffix", ChangeType.RESTORED))
            )
        }

        if (baselineRule == null && oldRule != null && newRule != null) {
            val removedApps = oldRule.packageNames - newRule.packageNames
            if (removedApps.isNotEmpty()) {
                return ChangeAnalysis(
                    isOverallAdverse = false,
                    details = listOf(
                        ChangeDetail(
                            "恢复到本次刷新时的基准设置：${formatAppNames(context, removedApps)}",
                            ChangeType.RESTORED
                        )
                    )
                )
            }
        }

        return analyzeChange(context, baselineRule ?: oldRule, newRule)
    }

    fun analyzeChange(
'@
          Regex-Replace-Required $manager $displayPattern $displayReplacement

          Replace-Required $manager '立即删除 (仍有窗口):' '删除（仍有其他窗口）:'
          Replace-Required $manager '延迟删除 (最后窗口):' '删除（最后一个窗口）:'
          Replace-Required $manager '新增 (追加窗口 → 延迟):' '新增应用（已有其他窗口）:'
          Replace-Required $manager '新增 (首个窗口 → 立即):' '新增应用（首个窗口）:'
          Replace-Required $manager '移除 (最后窗口 → 延迟):' '移除应用（最后一个窗口）:'
          Replace-Required $manager '移除 (仍有窗口 → 立即):' '移除应用（仍有其他窗口）:'
          Replace-Required $manager '减少日期 (仍有兜底 → 立即):' '减少日期（仍有其他规则兜底）:'
          Replace-Required $manager '减少日期 (有兜底 → 立即):' '减少日期（有其他规则兜底）:'
          Replace-Required $manager '减少日期 (无兜底 → 延迟):' '减少日期（无其他规则兜底）:'
          Replace-Required $manager '[删除-部分延迟]' '[删除-部分待生效]'
          Replace-Required $manager '  - 延迟删除:' '  - 下一刷新时刻删除:'
          Replace-Required $manager '[新增-部分延迟]' '[新增-部分待生效]'
          Replace-Required $manager '  - 延迟生效:' '  - 下一刷新时刻生效:'
          Replace-Required $manager '"次日生效"' '"下一刷新时刻"'

          Replace-Required $manual '- **放宽限制：延期生效。**' '- **放宽限制：下一刷新时刻生效。**'
          Replace-Required $manual '把 1 小时放宽到 3 小时：属于放宽，延期；' '把 1 小时放宽到 3 小时：属于放宽，在下一刷新时刻生效；'
          Replace-Required $manual '### 全部次日' '### 统一延后'
          Replace-Required $manual '- 放宽：下一刷新时刻生效。' '- 放宽：下一刷新时刻生效；\n- 恢复到当前基准：立即生效。'
          Replace-Required $manual '所以“加严立即、放宽延期”是正常保护期的主原则' '所以“加严立即、放宽下一刷新时刻生效”是正常保护期的主原则'

      - name: Commit patch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zhizhi/app/ui/AppWindowFragment.kt app/src/main/java/com/zhizhi/app/manager/AppWindowManager.kt docs/使用手册.md
          if (git diff --cached --quiet) {
            Write-Host "No patch changes to commit"
            exit 0
          }
          git commit -m "fix: unify baseline rule display semantics [rule-display-patch]"
          git push origin HEAD:ai/rule-display-baseline-consistency
