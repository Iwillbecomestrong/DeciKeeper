name: Release Verification

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests, lint, and unsigned Release build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace -Duser.timezone=Asia/Shanghai

      - name: Verify Release artifact
        shell: pwsh
        run: |
          # 数组展开只会按位置传参，具名参数必须用哈希表展开
          # CI 没有签名密钥，产物名为 app-release-unsigned.apk；本地签名构建为 app-release.apk
          $apk = Get-ChildItem 'app/build/outputs/apk/release' -Filter '*.apk' | Select-Object -First 1
          if (-not $apk) { throw 'Release APK not found under app/build/outputs/apk/release' }
          $verifyParams = @{
            ApkPath         = $apk.FullName
            OutputDirectory = 'app/build/release-verification'
            TestStatus      = 'passed'
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $verifyParams.ExpectedVersionName = $env:GITHUB_REF_NAME -replace '^v', ''
            $verifyParams.ExpectedTag = $env:GITHUB_REF_NAME
          }
          & ./scripts/verify_release_artifact.ps1 @verifyParams

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: DeciKeeper-release-verification
          path: |
            app/build/release-verification/release-manifest.json
            app/build/release-verification/*.sha256
          if-no-files-found: error
