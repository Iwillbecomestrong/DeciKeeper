name: One-shot Rule Copy Cleanup

on:
  push:
    branches: [ai/rule-display-baseline-consistency]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ai/rule-display-baseline-consistency
          fetch-depth: 0

      - name: Normalize remaining user-facing copy and self-delete
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manager = 'app/src/main/java/com/zhizhi/app/manager/AppWindowManager.kt'
          $content = [System.IO.File]::ReadAllText($manager, [System.Text.Encoding]::UTF8)

          $old1 = -join ([char[]](0x90E8,0x5207,0x5F85,0x751F,0x6548))
          $new1 = -join ([char[]](0x90E8,0x5206,0x5F85,0x751F,0x6548))
          $old2 = -join ([char[]](0x5F85,0x751F,0x6548,0x2D,0x90E8,0x5206,0x5EF6,0x8FDF))
          $new2 = -join ([char[]](0x90E8,0x5206,0x5F85,0x751F,0x6548))

          if (-not $content.Contains($old1)) { throw 'Expected corrupted copy token was not found' }
          if (-not $content.Contains($old2)) { throw 'Expected legacy delayed copy token was not found' }

          $content = $content.Replace($old1, $new1).Replace($old2, $new2)
          if ($content.Contains($old1) -or $content.Contains($old2)) { throw 'Copy cleanup did not fully apply' }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manager, $content, $utf8NoBom)

          git rm .github/workflows/_temp_rule_copy_cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $manager
          git commit -m "fix: normalize remaining rule change copy"
          git push origin HEAD:ai/rule-display-baseline-consistency
