name: One-shot final documentation convergence

on:
  push:
    branches:
      - ai/time-rules-spec-sync
    paths:
      - .github/workflows/one-shot-final-doc-convergence.yml

permissions:
  contents: write

jobs:
  converge-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ai/time-rules-spec-sync
          fetch-depth: 0

      - name: Remove retired requirements entry and sync document map
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected pattern not found ({label}): {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_required(
              "SPEC.md",
              "> 详细模块规格由 [`docs/specs/`](docs/specs/) 承担。旧 [`docs/specs/requirements.md`](docs/specs/requirements.md) 在迁移完成前仅作为历史需求输入，不再与本文件并列作为另一份当前真相。",
              "> 详细模块规格由 [`docs/specs/`](docs/specs/) 承担；历史版本与已退役需求由 Git 历史保留，不再维护第二套并列规格。",
              "SPEC retired requirements transition",
          )
          replace_required(
              "SPEC.md",
              "`docs/specs/requirements.md` 是旧阶段形成的历史全量需求文档。其仍有价值的内容应逐项审计并迁移到上述明确 owner；迁移完成后删除旧文件，避免产生两套并列规格。",
              "旧阶段的巨型全量需求文档已经完成拆分与退役；仍有价值的历史内容由 Git 保留，当前详细规则只在上表对应的 scoped spec 中维护。",
              "SPEC module-map retirement note",
          )
          replace_required(
              "docs/README.md",
              "App Help\n  ↓ 后续与使用手册同源",
              "App Help\n  ↓ 构建时读取同一份使用手册资源",
              "Help single-source status",
          )
          replace_required(
              "PLAN.md",
              "- [x] 将旧 `docs/specs/requirements.md` 退役为迁移入口，不再维护第二套巨型当前需求真相。",
              "- [x] 完成旧巨型 requirements 规格迁移并删除退役入口，不再维护第二套当前需求真相。",
              "PLAN retired requirements status",
          )
          replace_required(
              "PLAN.md",
              "- [ ] 清理设置页中已迁走的时间规则策略死代码，保持职责一致。",
              "- [x] 清理设置页中已迁走的时间规则策略死代码，保持职责一致。",
              "PLAN settings dead-code task",
          )
          PY

          git rm docs/specs/requirements.md
          rm .github/workflows/one-shot-final-doc-convergence.yml

          if git grep -n 'docs/specs/requirements.md' -- ':!HISTORY.md' ':!docs/history/**' ':!.github/workflows/**'; then
            echo 'Live documentation still references docs/specs/requirements.md' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SPEC.md PLAN.md docs/README.md .github/workflows/one-shot-final-doc-convergence.yml
          git diff --cached --check
          git commit -m 'docs: finish specification document convergence'
          git push origin HEAD:ai/time-rules-spec-sync
