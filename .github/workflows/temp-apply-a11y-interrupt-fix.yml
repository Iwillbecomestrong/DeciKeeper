name: TEMP Apply A11y Interrupt Fix

on:
  push:
    branches:
      - fix/douyin-visible-multiwindow-presence

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: fix/douyin-visible-multiwindow-presence
          fetch-depth: 0

      - name: Detect Android SDK from adb
        shell: powershell
        run: |
          $adbCommand = Get-Command adb -ErrorAction Stop
          $adb = $adbCommand.Definition
          if (-not $adb -or -not (Test-Path $adb)) {
            throw "adb executable path could not be resolved from PowerShell alias definition"
          }
          $sdkRoot = Split-Path (Split-Path $adb -Parent) -Parent
          if (-not (Test-Path (Join-Path $sdkRoot "platforms\android-36"))) {
            throw "Android SDK 36 not found under detected SDK root: $sdkRoot"
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply minimal lifecycle fix
        shell: powershell
        run: |
          $path = "app/src/main/java/com/ironwill/app/service/CoreService.kt"
          $content = [System.IO.File]::ReadAllText($path)
          $old = @'
              override fun onInterrupt() {
                  Log.d(TAG, "CoreService Interrupted")
                  Log.e("IronWill_Debug", "CRITICAL: CoreService Interrupted (onInterrupt). System might be killing it or user disabled it.")
                  isServiceActive = false
                  lastAccessibilitySignalTime = 0L
              }
          '@
          $new = @'
              override fun onInterrupt() {
                  // Framework callback for interrupting Accessibility feedback, not a service disconnect.
                  // Android may continue delivering events after this callback, so connection state must remain valid.
                  Log.w("IronWill_Debug", "[Lifecycle] onInterrupt: feedback interrupted; service remains connected")
              }
          '@
          if (-not $content.Contains($old)) {
            throw "Expected onInterrupt block not found; refusing broad or ambiguous edit"
          }
          $content = $content.Replace($old, $new)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $content, $utf8NoBom)
          git diff --check
          git diff -- $path

      - name: Run all unit tests
        shell: powershell
        run: .\gradlew.bat --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: powershell
        run: .\gradlew.bat --no-daemon assembleDebug

      - name: Commit verified fix
        shell: powershell
        run: |
          git config user.name "IronWill CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/ironwill/app/service/CoreService.kt
          git commit -m "fix(a11y): keep service active across onInterrupt"
          git push origin HEAD:fix/douyin-visible-multiwindow-presence

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IronWill-interrupt-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
