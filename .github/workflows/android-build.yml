name: Android Build (Self-hosted Windows)

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply lock exit authority patch
        shell: powershell
        run: .\scripts\ci\apply_lock_exit_authority.ps1

      - name: Detect Android SDK from adb
        shell: powershell
        run: |
          $adbCommand = Get-Command adb -ErrorAction Stop
          $adb = $adbCommand.Definition
          if (-not $adb -or -not (Test-Path $adb)) {
            throw "adb executable path could not be resolved from PowerShell alias definition"
          }
          $sdkRoot = Split-Path (Split-Path $adb -Parent) -Parent
          Write-Host "adb=$adb"
          Write-Host "Detected Android SDK root=$sdkRoot"
          if (-not (Test-Path (Join-Path $sdkRoot "platforms\android-36"))) {
            throw "Android SDK 36 not found under detected SDK root: $sdkRoot"
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle wrapper
        shell: powershell
        run: .\gradlew.bat --version

      - name: Run all unit tests
        shell: powershell
        run: .\gradlew.bat --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: powershell
        run: .\gradlew.bat --no-daemon assembleDebug

      - name: Commit verified lock exit authority sources
        if: success() && github.event_name == 'pull_request'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zhizhi/app/ui/LockWindowManager.kt
          git add app/src/main/java/com/zhizhi/app/service/MonitorService.kt
          git add app/src/main/java/com/zhizhi/app/service/CoreService.kt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated source changes to commit."
          } else {
            git commit -m "fix: enforce explicit lock exit authority"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          }

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IronWill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
