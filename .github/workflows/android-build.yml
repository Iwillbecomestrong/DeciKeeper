name: Android Build (Self-hosted Windows)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect local build environment
        shell: powershell
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          if (Get-Command java -ErrorAction SilentlyContinue) { java -version } else { Write-Host "java: not found" }
          if (Get-Command adb -ErrorAction SilentlyContinue) { adb version } else { Write-Host "adb: not found on PATH" }
          if (Get-Command sdkmanager -ErrorAction SilentlyContinue) { sdkmanager --version } else { Write-Host "sdkmanager: not found on PATH" }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle wrapper
        shell: powershell
        run: .\gradlew.bat --version

      - name: Build debug APK
        shell: powershell
        run: .\gradlew.bat --no-daemon assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IronWill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
