name: Manual Windows Build (Self-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-build:
    name: Manual Build on Self-hosted Runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Android SDK from adb
        shell: powershell
        run: |
          $adbCommand = Get-Command adb -ErrorAction Stop
          $adb = $adbCommand.Definition
          if (-not $adb -or -not (Test-Path $adb)) {
            throw "adb executable path could not be resolved from PowerShell alias definition"
          }
          $sdkRoot = Split-Path (Split-Path $adb -Parent) -Parent
          if (-not (Test-Path (Join-Path $sdkRoot "platforms\android-36"))) {
            throw "Android SDK 36 not found under detected SDK root: $sdkRoot"
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all unit tests
        shell: powershell
        run: .\gradlew.bat --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: powershell
        run: .\gradlew.bat --no-daemon assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: DeciKeeper-debug-apk-windows
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
