name: Apply alarm wake statistics patch

on:
  push:
    branches: [ai/fix-alarm-wake-statistics]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wake-stats-applied]') }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/fix-alarm-wake-statistics
          fetch-depth: 0
      - name: Apply source patch
        shell: powershell
        run: .\.github\scripts\patch_alarm_wake_stats.ps1
      - name: Commit patched sources and remove temporary files
        shell: powershell
        run: |
          git rm .github/workflows/_temp_apply_alarm_wake_stats.yml
          git rm .github/scripts/patch_alarm_wake_stats.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zhizhi/app/manager/AlarmScheduler.kt
          git add app/src/main/java/com/zhizhi/app/manager/statistics/StatisticsRepository.kt
          git add app/src/main/java/com/zhizhi/app/ui/LockAlarmOverlay.kt
          git commit -m "fix: connect real alarm completion to wake statistics [wake-stats-applied]"
          git push origin HEAD:ai/fix-alarm-wake-statistics
